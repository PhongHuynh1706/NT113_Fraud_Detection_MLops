apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: fraud-production
resources:
  - ../../base
patches:
  - target:
      kind: HorizontalPodAutoscaler
      name: fraud-api
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 2
      - op: replace
        path: /spec/maxReplicas
        value: 10
