name: Fraud Detection Docker CI

on:
  workflow_run:
    workflows: ["Fraud Detection Python CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker:
    name: Build, Scan and Push Docker Images
    runs-on: ubuntu-latest

    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event != 'pull_request' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.head_repository.full_name == github.repository
        )
      }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - component: serving
            dockerfile: docker/Dockerfile.serving
          - component: training
            dockerfile: docker/Dockerfile.training

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          load: true
          push: false
          platforms: linux/amd64
          tags: |
            phonghuynh1706/nt113:fraud-detection-${{ matrix.component }}-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Inspect Python dependencies
        shell: bash
        run: |
          IMAGE="phonghuynh1706/nt113:fraud-detection-${{ matrix.component }}-latest"

          docker run --rm \
            --entrypoint /bin/sh \
            "$IMAGE" \
            -c '
              echo "=== Installed package metadata ==="
              find /usr/local/lib /opt/venv \
                \( -iname "*setuptools*.dist-info" \
                -o -iname "*wheel*.dist-info" \
                -o -iname "*jaraco.context*.dist-info" \
                -o -iname "*jaraco_context*.dist-info" \) \
                -print 2>/dev/null || true
            '

      - name: Scan Docker image with Trivy
        shell: bash
        run: |
          set -euo pipefail

          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$HOME/.cache/trivy:/root/.cache/" \
            aquasec/trivy:0.69.3 \
            image \
            --image-src docker \
            --format table \
            --vuln-type os,library \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --exit-code 1 \
            "phonghuynh1706/nt113:fraud-detection-${{ matrix.component }}-latest"

      - name: Push Docker image
        run: |
          docker push phonghuynh1706/nt113:fraud-detection-${{ matrix.component }}-latest
