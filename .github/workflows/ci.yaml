name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: pytest --cov=fraud_detection --cov-report=xml --cov-report=term-missing
      - uses: azure/setup-kubectl@v4
        with:
          version: v1.36.1
      - run: |
          kubectl kustomize K8s/overlays/test > /tmp/test.yaml
          kubectl kustomize K8s/overlays/production > /tmp/production.yaml
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.9
      - run: terraform fmt -check -recursive terraform
      - run: |
          for environment in test production; do
            terraform -chdir=terraform/environments/$environment init -backend=false
            terraform -chdir=terraform/environments/$environment validate
          done
      - name: SonarQube scan and quality gate
        if: vars.SONAR_ENABLED == 'true' && github.event_name == 'push'
        uses: SonarSource/sonarqube-scan-action@v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
        with:
          args: >-
            -Dsonar.qualitygate.wait=true
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.publish.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build a single image for scanning and publishing
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          load: true
          tags: fraud-api:ci
      - name: Smoke test runtime container
        run: |
          docker run --detach --name fraud-api-smoke --publish 127.0.0.1:18000:8000 fraud-api:ci
          python3 workflow/smoke_container.py
      - name: Clean up smoke test container
        if: always()
        run: |
          docker logs fraud-api-smoke || true
          docker rm --force fraud-api-smoke || true
      - name: Scan image
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          version: v0.76.2
          image-ref: fraud-api:ci
          severity: HIGH,CRITICAL
          exit-code: '1'
          scanners: vuln
      - name: Publish the scanned image
        id: publish
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag fraud-api:ci "$image"
          docker push "$image"
          digest=$(docker inspect --format='{{index .RepoDigests 0}}' "$image")
          echo "image=$digest" >> "$GITHUB_OUTPUT"
  deploy-test:
    needs: image
    if: github.event_name == 'push' && vars.ENABLE_TEST_DEPLOY == 'true'
    uses: ./.github/workflows/deploy.yaml
    with:
      environment: test
      image: ${{ needs.image.outputs.image }}
    secrets: inherit
