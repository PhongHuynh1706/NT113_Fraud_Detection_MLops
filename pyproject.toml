[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fraud-detection-mlops"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "prometheus-client>=0.21,<1",
    "pandas>=2.2,<3",
    "numpy>=1.26,<3",
    "scikit-learn>=1.5,<2",
    "catboost>=1.2,<2",
    "lightgbm",
    "xgboost",
    "mlflow>=3,<4",
    "PyYAML>=6,<7",
]

[tool.setuptools.packages.find]
where = ["src"]